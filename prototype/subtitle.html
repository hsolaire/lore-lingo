<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LensLingo — 字幕</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-od-id="subtitle-body" class="win-subtitle">

  <!-- 独立字幕条窗口：置顶浮动、控制排在上方一排、鼠标移开隐藏、可拖动 -->
  <div class="lyric-bar" id="lyricBar" data-od-id="lyric-bar">
    <div class="lyric-ctrl" data-od-id="lyric-controls">
      <span class="cnow"><span class="dot"></span><span id="cnowText">VLC · 实时</span></span>
      <button class="cbtn" id="lyricReselect" title="重选捕获" aria-label="重选捕获">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
      </button>
      <button class="cbtn" id="lyricFlip" title="切换翻译方向" aria-label="切换翻译方向">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>
      </button>
      <button class="cbtn" id="lyricPin" title="窗口置顶" aria-label="窗口置顶">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
      </button>
      <button class="cbtn" id="lyricCopy" title="复制译文" aria-label="复制译文">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      </button>
      <span class="cdiv"></span>
      <button class="cbtn" id="lyricMain" title="打开主面板" aria-label="打开主面板">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      </button>
      <button class="cbtn danger" id="lyricClose" title="关闭字幕窗口" aria-label="关闭字幕窗口">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div class="lyric-box" id="lyricBox" data-od-id="lyric-box">
      <span class="lyric-hit" id="lyricHit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span id="lyricHitText">字幕库命中</span></span>
      <p class="lyric-src" id="lyricSrc">I never thought I'd find you here, of all places.</p>
      <p class="lyric-tgt" id="lyricTgt">没想到会在这种地方遇见你。</p>
    </div>
  </div>

  <div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span id="toastMsg">已复制</span></div>

<script src="bridge.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const LL = window.LensLingo;

  const lyricBar = $('#lyricBar'), lyricBox = $('#lyricBox');
  const lyricSrc = $('#lyricSrc'), lyricTgt = $('#lyricTgt');
  const lyricHit = $('#lyricHit'), lyricHitText = $('#lyricHitText');
  const cnowText = $('#cnowText'), lyricPin = $('#lyricPin');

  // ---- 渲染共享状态 ----
  function render(s, keys) {
    // 方向切换时做淡入淡出
    const swapping = keys && (keys.includes('from') || keys.includes('to'));
    if (swapping) lyricBox.classList.add('swap');
    setTimeout(() => {
      lyricSrc.textContent = s.src;
      lyricTgt.textContent = s.tgt;
      lyricBox.classList.remove('swap');
    }, swapping ? 160 : 0);
    lyricHit.classList.toggle('model', s.hit === 'model');
    lyricHitText.textContent = s.hit === 'model' ? '模型翻译' : '字幕库命中';
    cnowText.textContent = (s.capture.name.split(' ')[0] || 'VLC') + ' · 实时';
    lyricPin.classList.toggle('active', !!s.pinned);
  }
  render(LL.get());
  LL.subscribe(render);

  // ---- 控制排按钮 ----
  $('#lyricReselect').addEventListener('click', () => toast('已重新捕获窗口'));
  $('#lyricFlip').addEventListener('click', () => {
    const s = LL.get();
    LL.set({ from: s.to, to: s.from, src: s.tgt, tgt: s.src });
    toast('已切换翻译方向');
  });
  lyricPin.addEventListener('click', () => { LL.set({ pinned: !LL.get('pinned') }); toast(LL.get('pinned') ? '窗口已置顶' : '取消置顶'); });
  $('#lyricCopy').addEventListener('click', () => {
    if (navigator.clipboard) navigator.clipboard.writeText(lyricTgt.textContent).catch(()=>{});
    toast('已复制译文');
  });
  $('#lyricMain').addEventListener('click', () => LL.openWindow('main'));
  $('#lyricClose').addEventListener('click', () => { toast('字幕窗口已关闭'); setTimeout(() => { try { window.close(); } catch(_){} }, 400); });

  // ---- 控制排：鼠标移开隐藏（进入时先亮一下） ----
  let peekTimer;
  function peek(ms = 2200) {
    lyricBar.classList.add('peek');
    clearTimeout(peekTimer);
    peekTimer = setTimeout(() => lyricBar.classList.remove('peek'), ms);
  }
  lyricBar.addEventListener('mouseleave', () => { clearTimeout(peekTimer); lyricBar.classList.remove('peek'); });
  lyricBar.addEventListener('mouseenter', () => { clearTimeout(peekTimer); });
  peek();  // 打开窗口时先显示控件位置

  // ---- 字幕框可拖动（位置持久化，仅本窗口） ----
  let drag = null;
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  function applyPos(x, y) {
    const w = lyricBar.offsetWidth, h = lyricBar.offsetHeight;
    x = clamp(x, 8, window.innerWidth  - w - 8);
    y = clamp(y, 8, window.innerHeight - h - 8);
    lyricBar.classList.add('placed');
    lyricBar.style.left = x + 'px';
    lyricBar.style.top  = y + 'px';
  }
  lyricBox.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    const r = lyricBar.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top, moved: false };
    lyricBar.classList.add('dragging');
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    drag.moved = true;
    applyPos(e.clientX - drag.dx, e.clientY - drag.dy);
  });
  window.addEventListener('mouseup', () => {
    if (!drag) return;
    lyricBar.classList.remove('dragging');
    if (drag.moved) {
      try { localStorage.setItem('lenslingo:subpos', JSON.stringify({ x: parseInt(lyricBar.style.left), y: parseInt(lyricBar.style.top) })); } catch(_){}
      peek();
    }
    drag = null;
  });
  try {
    const p = JSON.parse(localStorage.getItem('lenslingo:subpos') || 'null');
    if (p && typeof p.x === 'number') applyPos(p.x, p.y);
  } catch(_){}
  window.addEventListener('resize', () => {
    if (lyricBar.classList.contains('placed'))
      applyPos(parseInt(lyricBar.style.left) || 0, parseInt(lyricBar.style.top) || 0);
  });

  // toast
  let toastTimer; const toastEl = $('#toast'), toastMsg = $('#toastMsg');
  function toast(msg) {
    toastMsg.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }
})();
</script>
</body>
</html>
