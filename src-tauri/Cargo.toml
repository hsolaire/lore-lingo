[package]
name = "lore-lingo"
version = "0.0.0"
description = "LoreLingo — 屏幕区域翻译"
authors = []
edition = "2021"

[lib]
name = "lore_lingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lore-lingo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

# 屏幕截图（macOS / Windows / Linux 均支持）
screenshots = "0.8"
base64 = "0.22"
image = { version = "0.24", default-features = false, features = ["png"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring-core = "1"
windows-native-keyring-store = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
block2 = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "SCShareableContent", "SCStream", "SCScreenshotManager", "block2", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGContext", "CGColorSpace", "CGBitmapContext"] }
core-foundation = "0.9"
core-graphics = "0.23.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSArray",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSGeometry",
  "NSString",
  "std",
] }
